name: Docs

# Disabled on push / pull_request: CI now runs on Buildkite
# (https://buildkite.com/iand675/wireform). Kept as workflow_dispatch so
# the docs build + gh-pages deploy can still be triggered manually.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  haddock:
    # Build per-package Haddock HTML.  We let this fail without taking down
    # the deploy: when no Haddocks land, the ingester falls back to the
    # in-tree fixture so the site still ships.
    name: Build Haddocks
    # Skipped on pull requests: link validation only needs the in-tree
    # fixture, and a full 'cabal v2-haddock all' is far too heavy to run
    # on every PR.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      have-haddock: ${{ steps.collect.outputs.have-haddock }}
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.10.3'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-haddock-ghc-9.10.3-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-haddock-ghc-9.10.3-

      - name: Install system dependencies
        # wireform-kafka uses pkg-config-depends for libsnappy /
        # liblz4 / libzstd, and wireform-arrow links libzstd and
        # liblz4 directly; without them 'cabal v2-haddock all' can't
        # even resolve dependencies. librdkafka-dev backs
        # hw-kafka-client which the wireform-kafka benchmarks use.
        # protobuf-compiler provides 'protoc', invoked at configure
        # time by proto-lens-protobuf-types' custom Setup.hs (pulled
        # in transitively via temporal-test).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgmp-dev \
            libsnappy-dev \
            liblz4-dev \
            libzstd-dev \
            libbrotli-dev \
            librdkafka-dev \
            protobuf-compiler

      - name: Configure
        run: cabal configure --enable-documentation

      - name: Build dependencies first
        run: cabal build all --only-dependencies

      - name: Generate Haddock HTML for all packages
        run: |
          cabal v2-haddock all \
            --haddock-html \
            --haddock-hyperlink-source \
            --haddock-quickjump

      - name: Collect Haddock output into a single tree
        id: collect
        run: |
          set -euo pipefail
          mkdir -p haddock-out
          # cabal puts each package's HTML under
          #   dist-newstyle/build/<arch>/<ghc>/<pkg-version>/doc/html/<pkg>/
          # Flatten that into haddock-out/<pkg>/.
          shopt -s nullglob
          found=0
          for d in dist-newstyle/build/*/ghc-*/*/doc/html/*; do
            [ -d "$d" ] || continue
            pkg="$(basename "$d")"
            cp -r "$d" "haddock-out/$pkg"
            echo "  collected $pkg"
            found=1
          done
          if [ "$found" -eq 1 ]; then
            echo "have-haddock=true" >> "$GITHUB_OUTPUT"
          else
            echo "have-haddock=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Haddock artifact
        if: steps.collect.outputs.have-haddock == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haddock-html
          path: haddock-out
          retention-days: 7

  build-and-deploy:
    # The Astro build runs the starlight-links-validator plugin, so this
    # job doubles as the dead-link check on pull requests. The deploy
    # steps at the end are gated to non-PR events.
    name: Build & validate site
    runs-on: ubuntu-latest
    needs: [haddock]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 5.x requires Node >= 22.12; the previous '20' here
          # was failing the website build with an explicit engine
          # mismatch.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website deps
        working-directory: website
        run: npm ci || npm install

      - name: Download Haddock artifact (if present)
        if: ${{ needs.haddock.outputs.have-haddock == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: haddock-html
          path: haddock-out

      - name: Ingest Haddocks
        working-directory: website
        run: |
          if [ -d ../haddock-out ] && [ -n "$(ls -A ../haddock-out 2>/dev/null)" ]; then
            inputs=()
            for d in ../haddock-out/*/; do
              inputs+=(--input "$d")
            done
            echo "Ingesting real Haddocks: ${inputs[*]}"
            node scripts/ingest-haddock.mjs "${inputs[@]}"
          else
            echo "No Haddocks; falling back to in-tree fixture."
            node scripts/ingest-haddock.mjs --fallback-fixture
          fi

      - name: Build Astro site (validates internal links)
        working-directory: website
        run: npm run build

      - name: Disable Jekyll on Pages
        if: ${{ github.event_name != 'pull_request' }}
        run: touch website/dist/.nojekyll

      - name: Deploy to gh-pages branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: deploy ${{ github.sha }}'
