\* The broken pipeline: the out-of-band producer enqueues the purge when it
\* PUBLISHES (intent time) instead of when the consumer COMMITS the change
\* to the serving store. TLC finds the stale-refill race as a violation of
\* QuiescentCoherence: purge delivered -> read refills the cache with
\* pre-change data -> change commits -> no later message ever closes the
\* window. This config is EXPECTED TO FAIL; check.sh asserts that it does.
SPECIFICATION Spec
CONSTANTS
  MaxVer = 3
  PurgeAtIntent = TRUE
INVARIANTS
  TypeOK
  QuiescentCoherence
  ReadYourWrites
  TokenMonotone
