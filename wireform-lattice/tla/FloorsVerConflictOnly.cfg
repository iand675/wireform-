\* EXPECTED TO FAIL on AcceptedImpliesCut; check.sh asserts it does.
\*
\* The pre-Draft-32 convergence trigger: act only when two responses assert
\* different vers for one entity. The slices of a page are mostly DISJOINT
\* entity sets (that is what the authorization partition does), so a write
\* between the pub fetch and the priv fetch produces a rendered pair that
\* never coexisted - and no ver conflict ever fires. The counterexample
\* trace is the motivation for validity floors.
CONSTANTS
  MaxVer = 4
  MaxRevalidate = 2
  Detection = "verconflict"
  IndexAtCommit = TRUE
  LaggedReads = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AcceptedImpliesCut
