\* EXPECTED TO FAIL on SinglePageSnapshot; check.sh asserts it does.
\*
\* The tempting shortcut: execute each slice and serve whatever came back,
\* without validating that the snapshot token stood still. TLC finds the
\* mixed page - a write to each entity lands between the two slice
\* executions and the served pair never coexisted at any token. This trace
\* is 13.2 guarantee 7's MUST.
CONSTANTS
  MaxVer = 3
  ValidateSnapshot = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK SinglePageSnapshot
