\* EXPECTED TO FAIL on AcceptedImpliesCut; check.sh asserts it does.
\*
\* The floor index fed asynchronously AFTER commit visibility (a lagging
\* outbox relay - the natural first implementation on PostgreSQL, and the
\* race any in-process index has if it updates after the write commits).
\* A response computed at a snapshot that already sees the write, with a
\* floor computed from an index that does not yet, under-states its floor
\* and falsely certifies the interval - the assembly passes the cut test
\* while pairing bodies that never coexisted. This trace is the spec's
\* 10.2 prefix-completeness rule: floors MUST observe every invalidation
\* at or below the response's snapshot token (read the outbox under the
\* same snapshot as the data, index before visibility, or clamp to the
\* index watermark).
CONSTANTS
  MaxVer = 4
  MaxRevalidate = 2
  Detection = "intervals"
  IndexAtCommit = FALSE
  LaggedReads = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AcceptedImpliesCut
