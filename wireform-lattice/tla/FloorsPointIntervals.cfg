\* EXPECTED TO FAIL on NoiseGeneratesNoTraffic; check.sh asserts it does.
\*
\* No floor header (floor = token): the interval test degenerates to token
\* equality - equivalently, the naive "just compare the snapshots" design.
\* Unrelated commits (other tenants, other tables: any busy PostgreSQL LSN
\* or Kafka offset) advance the token without touching the page, so the
\* client revalidates in circles and exhausts K while both bodies are
\* current. Floors are what make divergence DECIDABLE instead of merely
\* visible; this trace is why they exist. (Safety still holds - point
\* intervals are conservative - which is also the backward-compatibility
\* story for floor-less origins.)
CONSTANTS
  MaxVer = 4
  MaxRevalidate = 2
  Detection = "pointintervals"
  IndexAtCommit = TRUE
  LaggedReads = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AcceptedImpliesCut NoiseGeneratesNoTraffic
