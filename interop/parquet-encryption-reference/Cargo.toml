[package]
name = "wireform-parquet-encryption-reference"
version = "0.1.0"
edition = "2021"

[features]
allocation-counts = []

[[bench]]
name = "encryption"
harness = false

[dependencies]
parquet = { version = "=60.1.0", default-features = false, features = ["arrow", "encryption"] }
arrow-array = "=60.1.0"
arrow-schema = "=60.1.0"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
