[package]
name = "wireform-ion-rs-interop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ion-rs = { version = "=1.1.0", features = ["experimental-serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ion_binary"
harness = false

[[bench]]
name = "ion_typed"
harness = false
