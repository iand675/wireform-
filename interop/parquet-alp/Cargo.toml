[package]
name = "wireform-parquet-alp-reference"
version = "0.1.0"
edition = "2021"

[features]
file-bench = ["parquet/arrow", "parquet/snap", "parquet/lz4", "parquet/zstd", "dep:arrow-array", "dep:arrow-schema"]

[[bench]]
name = "alp"
harness = false

[[bench]]
name = "parquet_byte_stream_split"
path = "../arrow-rs/benches/parquet_byte_stream_split.rs"
harness = false

[[bench]]
name = "parquet_dictionary"
path = "../arrow-rs/benches/parquet_dictionary.rs"
harness = false

[[bench]]
name = "parquet_file"
path = "benches/parquet_file.rs"
harness = false
required-features = ["file-bench"]

[dependencies]
# Keep this raw-ALP reference current without disturbing the established
# Arrow 58 fixtures and their recorded before/after comparisons.
parquet = { version = "=60.1.0", default-features = false, features = ["experimental"] }
bytes = "1"
arrow-array = { version = "=60.1.0", optional = true }
arrow-schema = { version = "=60.1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "rayon"] }
