syntax = "proto3";

// Keep wire shapes identical to bench/compare/bench.proto (proto-lens input).
// csharp_namespace drives the Haskell module layout (see Proto.CodeGen.moduleNameForProto).
package bench;

option csharp_namespace = "Bench.Wireform";

message Small {
  int64 id = 1;
  string name = 2;
  bool active = 3;
}

message Medium {
  string title = 1;
  int32 count = 2;
  double score = 3;
  bytes payload = 4;
  bool enabled = 5;
  int64 timestamp = 6;
  string description = 7;
  float ratio = 8;
}

message WithNested {
  int64 id = 1;
  Small inner = 2;
  string label = 3;
}

message WithRepeated {
  repeated int32 values = 1;
  repeated string tags = 2;
  repeated Small items = 3;
}
