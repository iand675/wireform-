syntax = "proto3";

package test.interop;

// Interop fixture for wireform-proto ↔ Python google-protobuf round-trip tests.
// Covers every field kind: scalars, enum, submessage, repeated, map, optional.

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW         = 1;
  PRIORITY_HIGH        = 2;
}

message Address {
  string street  = 1;
  string city    = 2;
  string country = 3;
}

message Person {
  string   name     = 1;
  int32    age      = 2;
  bool     active   = 3;
  double   score    = 4;
  bytes    payload  = 5;
  Priority priority = 6;
  Address  address  = 7;
  repeated string tags   = 8;
  map<string, int32> ratings = 9;
  optional string nickname = 10;
}

message NumberKinds {
  int32  i32   = 1;
  int64  i64   = 2;
  uint32 u32   = 3;
  uint64 u64   = 4;
  sint32 s32   = 5;
  sint64 s64   = 6;
  float  f32   = 7;
  double f64   = 8;
  fixed32  fx32 = 9;
  fixed64  fx64 = 10;
  sfixed32 sf32 = 11;
  sfixed64 sf64 = 12;
}
